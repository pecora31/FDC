mod_description=Indirect-fire tactical tablet add-on for SuperbWarfare artillery.
# Pinned SuperbWarfare CurseForge file — project id 1218165, file id 8104849
# (superbwarfare-0.8.9-final-mc1.20.1-6effe4385-all.jar, "Latest release" for 1.20.1 as of
# 2026-08-13). NOT the build addon-example pins (6529319 / 0.8.0, May 2025) — that one predates
# ItemScreenProvider, ArtilleryIndicatorItem, and the current NetworkRegistry entirely; see plan
# doc Phase 1 log entry 2026-08-13 for how that was discovered. Bump deliberately, re-verify class
# signatures in artillery-tactical-tablet-plan.md when you do.
#
# STAYING HERE ON PURPOSE (checked 2026-08-18). A newer 0.8.9.1 exists for 1.20.1 — file id
# 8644874, uploaded 2026-08-14 — and it is an ALPHA SNAPSHOT, not a release. Two reasons it was
# left alone rather than taken: this addon depends on SuperbWarfare and on nothing else, so every
# fault of theirs becomes ours, and a snapshot file can be replaced under the same id at any time.
# There is also no changelog to read — the GitHub releases page is empty — so what changed in it is
# simply unknown, and this project does not act on guesses about another mod's API.
#
# If it is taken later, the check is not the changelog: point this at 8644874, let Gradle fetch it,
# then javap the real jar for setTarget, modifyGunData, canRequestReload_unsynced and the gun data
# accessors, and diff against what the plan doc records. Those four are where this addon touches
# theirs, and all four have moved before.
sbw_curse_file=curse.maven:superb-warfare-1218165:8104849
# No map mod is a DEPENDENCY any more. JourneyMap (project 32274) and Xaero's World Map (project
# 317780) were both used as terrain sources at different points and both removed on 2026-08-14 —
# the tablet now surveys the world itself from the server side, which is the only approach that can
# show ground the player has never personally visited. SuperbWarfare is the addon's only mod
# dependency. Read the 2026-08-14 log entries in artillery-tactical-tablet-plan.md before pinning a
# map mod as a dependency again.
#
# Xaero's World Map is nonetheless pinned below, and it is NOT an integration. It is installed in the
# dev client on 2026-08-15 for ONE purpose: standing our own map next to the mod it has been measured
# against all along, so claims about shading, colour and smoothness can be compared by eye instead of
# argued from memory. It is declared `runtimeOnly` precisely so that the compiler will reject any
# attempt to call into it — the guard rail matters more than the pin. If you are reading this while
# wondering how to read tiles out of it: don't, that road has been walked four times and every one
# ended at "the client cannot know what it has never been sent".
# Project 317780, file 8449908 = xaeroworldmap-forge-1.20.1-1.44.2.jar (latest 1.20.1 Forge build).
# NOT currently installed — removed from build.gradle on request 2026-08-15. Kept here because the
# coordinate was worth the effort of finding, and because the two findings it gave us are still the
# basis of how the map is drawn: the nearest/linear filter pair, and prepareSingleplayer proving a
# client-side map cannot serve ground the player has never been near. Add one runtimeOnly line back
# to reinstate it.
xaero_worldmap_curse_file=curse.maven:xaeros-world-map-317780:8449908

# WhyMap (project 815690) was asked for and cannot be used: it ships Fabric builds only, with no
# Forge build for any Minecraft version. Its 1.20.1 files exist but are Fabric. Recorded so nobody
# spends the search again. Its distinguishing idea is worth knowing anyway — it serves the map over
# HTTP to a browser on localhost rather than drawing it in game, which is a different architecture
# from every other map mod here rather than a different renderer.
# JourneyMap, on the same footing and for the same reason — a second yardstick, not an integration.
# Two are better than one here: Xaero and JourneyMap made different choices about colour, water and
# downscaling, and where the two of them agree is a much stronger signal about what is conventional
# than where either differs from us. Project 32274, file 8620163 = journeymap-1.20.1-6.0.1+forge.
journeymap_curse_file=curse.maven:journeymap-32274:8620163

# BlueMap, brought in the same way JourneyMap is — a yardstick in the dev client only, never
# a dependency. Fetched for one comparison test (2026-08-18) at the user's request: does its
# background survey feel smoother than this addon's own. Verified against CurseForge's own file
# page rather than guessed: file 7057487 lists 1.20.1 explicitly among its supported versions.
bluemap_curse_file=curse.maven:bluemap-406463:7057487

# Performance mods, dev client only, same runtimeOnly footing as the two map mods above. None of
# these is a dependency and the addon must never require one — they are here so the tablet can be
# judged on a client that is set up the way players actually run this game.
#
# WHY THEY MATTER TO THIS ADDON SPECIFICALLY, which is not obvious: a Screen does not stop the world
# rendering behind it. The whole 3D scene is still drawn every frame while the tablet is open, so
# world render cost is *part of* the tablet's frame time. Chasing our own draw calls while the scene
# behind us costs ten times more was only ever half the picture.
#
# READ BEFORE MEASURING WITH THESE ON: they change the very thing being measured. Take any
# before/after reading of OUR OWN code with these off, then turn them on to see what a player sees.
embeddium_curse_file=curse.maven:embeddium-908741:5681725
ferritecore_curse_file=curse.maven:ferritecore-429235:4810975
modernfix_curse_file=curse.maven:modernfix-790626:8613265
canary_curse_file=curse.maven:canary-665658:5089991
#
# ImmediatelyFast is deliberately NOT here, and the reason is worth writing down so nobody adds it
# back. It crashes this dev client: its mixin config declares no refMap, so its SRG-named targets
# (m_285795_ and friends) cannot be mapped to the Parchment names the dev runtime actually has, and
# the injection fails critically at boot. That signature does exist in 1.20.1 — the mod is not
# incompatible with the game, it is incompatible with a ForgeGradle dev environment, and it works in
# a normally installed client. Same family of fault as the missing Mixin plugin in Phase 0.
#
# No loss for our purposes either way: it optimises immediate-mode GUI drawing, which is exactly the
# path this addon batched by hand, so it is the single worst mod to have installed while judging
# whether that work paid off.
